name = "factory-dashboard-api"
main = "src/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

# Production custom domain (Workers manages DNS + auto-provisions edge cert)
routes = [
  { pattern = "ingest.dashboard.saiteja.ai", custom_domain = true }
]

# DASHBOARD_DB — D1 (primary store as of 2026-04-26). KV retained one cycle for rollback.
[[d1_databases]]
binding = "DASHBOARD_DB"
database_name = "factory-dashboard-prod"
database_id = "14edaced-5eb2-4fd0-8867-74d6d893e512"

# Production KV namespace binding (retained one cycle for rollback — unused after D1 swap)
[[kv_namespaces]]
binding = "FACTORY_DASHBOARD"
id = "b02d01e3c9d34b4b85b30afe12ca4bcf"
preview_id = "92fa211149f24b5992c6be87227c4257"

# Secrets (set via: wrangler secret put <NAME>)
# INGEST_TOKEN             — 32-byte URL-safe bearer token for daemon ingest
# CF_ACCESS_AUD_SNAPSHOT   — AUD tag for the Factory Dashboard CF Access app
# CF_ACCESS_TEAM_DOMAIN    — e.g. "yourteam.cloudflareaccess.com"
#
# Mobile secrets — set once per environment after first deploy:
#   wrangler secret put MOBILE_JWT_SIGNING_KEY   # openssl rand -base64 32
#   wrangler secret put MOBILE_PUSH_SECRET        # openssl rand -base64 32
#   wrangler secret put APPLE_CLIENT_ID           # Apple Services ID for Sign In with Apple
#   wrangler secret put GOOGLE_CLIENT_ID          # Google OAuth client ID
#
# Staging equivalents:
#   wrangler secret put MOBILE_JWT_SIGNING_KEY --env staging
#   wrangler secret put MOBILE_PUSH_SECRET --env staging
#   wrangler secret put APPLE_CLIENT_ID --env staging
#   wrangler secret put GOOGLE_CLIENT_ID --env staging

# CF Queue — mobile intake bridge (producer in Worker; consumer = mobile_intake_poller.py)
[[queues.producers]]
binding = "MOBILE_INTAKE_QUEUE"
queue   = "mobile_intake_queue"

# ── Staging environment ──────────────────────────────────────────────────────
# Separate Worker name + KV namespace; deployed via:
#   npx wrangler deploy --env staging
# Reachable at the workers.dev URL (no custom route — keeps DNS/Access out of
# scope for staging audits). Uses a separate INGEST_TOKEN so a leaked staging
# token cannot be replayed against prod.
[env.staging]
name = "factory-dashboard-api-staging"
workers_dev = true
routes = [
  { pattern = "staging.ingest.dashboard.saiteja.ai", custom_domain = true }
]

# DASHBOARD_DB — D1 (primary store as of 2026-04-26). KV retained one cycle for rollback.
[[env.staging.d1_databases]]
binding = "DASHBOARD_DB"
database_name = "factory-dashboard-staging"
database_id = "b9fe7862-4d39-45c5-b026-7fb647d3ade6"

[[env.staging.kv_namespaces]]
binding = "FACTORY_DASHBOARD"
id = "0702ee5865274c4c8dc89ea54c2ee2ff"
preview_id = "68c462e9a6134c73b75fd062449189f2"
