name = "factory-dashboard-api"
main = "src/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

# Routes
routes = [
  { pattern = "ingest.dashboard.saiteja.ai/*", zone_name = "saiteja.ai" }
]

# KV namespace binding (namespace must be created and ID set before deploy)
# Run: wrangler kv:namespace create FACTORY_DASHBOARD
# Then replace the placeholder IDs below.
[[kv_namespaces]]
binding = "FACTORY_DASHBOARD"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"

# Secrets (set via: wrangler secret put <NAME>)
# INGEST_TOKEN             — 32-byte URL-safe bearer token for daemon ingest
# CF_ACCESS_AUD_SNAPSHOT   — AUD tag for the Factory Dashboard CF Access app
# CF_ACCESS_TEAM_DOMAIN    — e.g. "yourteam.cloudflareaccess.com"
